<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Probabili Euroleghe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: in alto scelta della squadra, poi il campo con la formazione consigliata, sotto la rosa completa per ruolo */
:root {
  --bg: #eef1ee;
  --surface: #ffffff;
  --ink: #17211c;
  --muted: #5b6861;
  --line: #d6dcd7;
  --pitch: #1d5a3f;
  --pitch-line: #2f7354;
  --on-pitch: #f2f7f3;
  --on-pitch-warn: #ffd27a;
  --on-pitch-bad: #ffb3b6;
  --good: #1d8549;
  --warn: #b57a06;
  --bad: #c3323a;
  --focus: #1f6fd6;
  --r-p: #e39a12;
  --r-d: #3c9f2a;
  --r-c: #1f6fd6;
  --r-a: #d8323b;
  --r-x: #7d8a83;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111714; --surface: #1a221e; --ink: #e7eee9; --muted: #9aa8a0; --line: #2c3731;
    --pitch: #18432f; --pitch-line: #24583f; --on-pitch: #eef6f0;
    --good: #45b874; --warn: #e2a93a; --bad: #e5646a; --focus: #6aa6ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111714; --surface: #1a221e; --ink: #e7eee9; --muted: #9aa8a0; --line: #2c3731;
  --pitch: #18432f; --pitch-line: #24583f; --on-pitch: #eef6f0;
  --good: #45b874; --warn: #e2a93a; --bad: #e5646a; --focus: #6aa6ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 { font-size: 30px; line-height: 1.1; }
h2 { font-size: 21px; text-transform: uppercase; letter-spacing: .04em; }
.sub { color: var(--muted); font-size: 14px; }
.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; justify-content: space-between; }
.teambar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
select, input[type=text], textarea { font: inherit; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; }
select { font-weight: 600; }
button { font: 600 14px var(--font-body); cursor: pointer; }
.btn { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--ink); background: var(--ink); color: var(--surface); }
.ghost { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--ink); }
.danger { color: var(--bad); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible, .team-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.chip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.chip.info { color: var(--muted); }
.role { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; color: #fff; font: 700 13px/1 var(--font-display); flex: none; }
.role.P { background: var(--r-p); } .role.D { background: var(--r-d); } .role.C { background: var(--r-c); } .role.A { background: var(--r-a); } .role.X { background: var(--r-x); }

/* Scelta squadra */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.team-btn { display: grid; gap: 2px; text-align: left; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.team-btn:hover { border-color: var(--pitch-line); background: color-mix(in srgb, var(--pitch) 8%, var(--bg)); }
.team-name { font: 700 19px/1.15 var(--font-display); letter-spacing: .02em; }

/* Campo */
.pitch { background: var(--pitch); color: var(--on-pitch); border-radius: 18px; padding: 16px; display: grid; gap: 14px; position: relative; overflow: hidden; }
.pitch::before { content: ""; position: absolute; inset: 12px; border: 2px solid var(--pitch-line); border-radius: 10px; pointer-events: none; }
.pitch::after { content: ""; position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; transform: translate(-50%, -50%); border: 2px solid var(--pitch-line); border-radius: 50%; pointer-events: none; }
.pitch-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
.modules { display: flex; flex-wrap: wrap; gap: 6px; }
.modules button { font: 600 14px var(--font-display); letter-spacing: .03em; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--pitch-line); background: transparent; color: var(--on-pitch); }
.modules button[aria-pressed="true"] { background: var(--on-pitch); color: var(--pitch); }
.line { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; position: relative; z-index: 1; margin-bottom: 10px; }
.slot { width: 152px; min-height: 86px; background: color-mix(in srgb, var(--on-pitch) 11%, transparent); border: 1px solid color-mix(in srgb, var(--on-pitch) 18%, transparent); border-radius: 12px; padding: 8px 10px; display: grid; gap: 3px; align-content: start; min-width: 0; }
.slot.empty { place-content: center; color: color-mix(in srgb, var(--on-pitch) 65%, transparent); font-size: 13px; text-align: center; }
.slot .nm { display: flex; align-items: center; gap: 6px; font-weight: 600; line-height: 1.15; min-width: 0; }
.slot .nm span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .vs { font-size: 12.5px; opacity: .88; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .pc { font: 700 20px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.slot .flag { font-size: 11.5px; font-weight: 600; color: var(--on-pitch-bad); }
.bench { position: relative; z-index: 1; border-top: 1px dashed var(--pitch-line); padding-top: 12px; display: grid; gap: 6px; }
.bench h3 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; opacity: .85; }
.bench ol { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; counter-reset: b; }
.bench li { counter-increment: b; display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; padding: 3px 9px 3px 4px; border-radius: 99px; background: color-mix(in srgb, var(--on-pitch) 10%, transparent); }
.bench li::before { content: counter(b); font: 700 12px var(--font-display); opacity: .7; padding-left: 4px; }
.bench .role { width: 19px; height: 19px; font-size: 11px; }

/* Rosa */
.add { display: flex; flex-wrap: wrap; gap: 8px; }
.add input[type=text] { flex: 1 1 240px; background: var(--bg); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 720px; }
th { text-align: left; font: 600 12px var(--font-body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.group td { background: var(--bg); font: 700 14px var(--font-display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 6px 8px; }
.who { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.small { font-size: 12.5px; color: var(--muted); }
.bar { display: grid; gap: 4px; min-width: 110px; }
.bar b { font: 700 19px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.bar i { display: block; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i::after { content: ""; display: block; height: 100%; width: var(--v); background: var(--c); }
.notes { display: flex; flex-wrap: wrap; gap: 4px; max-width: 300px; }
details { font-size: 13px; color: var(--muted); max-width: 300px; }
details summary { cursor: pointer; color: var(--ink); font-weight: 500; }
.x { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
.x:hover { color: var(--bad); }
textarea { width: 100%; min-height: 110px; background: var(--bg); }
.foot { color: var(--muted); font-size: 13px; max-width: 80ch; }
.foot a { color: inherit; }
.missing { color: var(--muted); font-style: italic; }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }
@media (max-width: 560px) {
  .slot { width: calc(50% - 5px); }
  h1 { font-size: 26px; }
}
@media (prefers-reduced-motion: no-preference) { .bar i::after { transition: width .3s ease; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Probabili Euroleghe</h1>
      <div class="sub" id="sub">Carico le probabili formazioni...</div>
    </div>
    <div class="teambar" id="teambar" hidden>
      <label class="sub" for="teamSelect">Squadra</label>
      <select id="teamSelect"></select>
    </div>
  </header>

  <div class="loading" id="loading">Carico le probabili formazioni...</div>

  <section class="card" id="picker" hidden>
    <h2>Qual è la tua squadra?</h2>
    <p class="sub">Toccala una volta: la pagina se la ricorda.</p>
    <div class="teams" id="teams"></div>
  </section>

  <section class="pitch" id="pitch" aria-label="Formazione consigliata" hidden>
    <div class="pitch-head">
      <h2>Formazione consigliata</h2>
      <div class="modules" id="modules" role="group" aria-label="Modulo"></div>
    </div>
    <div id="field"></div>
    <div class="bench">
      <h3>Panchina in ordine</h3>
      <ol id="bench"></ol>
    </div>
  </section>

  <section class="card" id="rosaCard" hidden>
    <h2 id="rosaTitle">La rosa</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Giocatore</th><th>Squadra</th><th>Partita</th><th>Titolare</th><th>Note</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script>
const ROLES = ["P", "D", "C", "A"];
const ROLE_NAME = { P: "Portieri", D: "Difensori", C: "Centrocampisti", A: "Attaccanti", X: "Ruolo sconosciuto" };
const ROLE_ONE = { P: "portiere", D: "difensore", C: "centrocampista", A: "attaccante" };
const MODULI = ["3-4-3", "3-5-2", "4-3-3", "4-4-2", "4-5-1", "5-3-2", "5-4-1"];

const store = {
  get(k, d) { try { const v = localStorage.getItem("euroleghe:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("euroleghe:" + k, JSON.stringify(v)); } catch {} },
};
const $ = id => document.getElementById(id);
const norm = s => (s || "").normalize("NFD").replace(/\p{M}/gu, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();

let DATI = null, SQUADRE = [], byName = new Map();
let attiva = store.get("squadraLega", null);
let modulo = store.get("modulo", "3-4-3");

function el(tag, attrs = {}, ...figli) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const f of figli.flat()) if (f != null && f !== false) e.append(f instanceof Node ? f : document.createTextNode(f));
  return e;
}

// ---------- Dati ----------
function trova(voce) {
  const esatti = byName.get(norm(voce.nome));
  return esatti && esatti.length ? esatti[0] : null;
}
function effPerc(g) {
  if (!g) return -1;
  if (g.avvisi.some(a => a.tipo === "Squalificato" || a.tipo === "Infortunato")) return 0;
  return g.perc ?? 0;
}
const colore = p => p >= 75 ? "var(--good)" : p >= 50 ? "var(--warn)" : "var(--bad)";
const partitaDi = g => DATI.partite[g.partita] || {};
function quando(p) {
  const m = /^(\S+)\s+(\d+)\s+(\S+),\s*(\d+:\d+)/.exec(p.quando || "");
  return m ? `${m[1].slice(0, 3)} ${+m[2]} ${m[3].slice(0, 3)} · ${m[4]}` : (p.quando || "");
}
function righeRosa(sq) {
  return sq.rosa.map((voce, i) => {
    let g = trova(voce);
    // Il ruolo dell'Excel vale per chi Fantacalcio.it elenca solo tra gli infortunati
    if (g && !g.ruolo) g = { ...g, ruolo: voce.ruolo };
    return { voce, i, g };
  });
}
const perOrdine = (x, y) => effPerc(y.g) - effPerc(x.g);
const squadraAttiva = () => SQUADRE.find(s => s.id === attiva) || null;

// ---------- Disegno ----------
function avvisiChips(g) {
  const out = g.avvisi.map(a => el("span", { class: "chip " + (a.tipo === "Diffidato" ? "info" : a.tipo === "In dubbio" ? "warn" : "bad"), title: a.nota || a.tipo }, a.tipo));
  if (g.ballottaggio) out.push(el("span", { class: "chip warn" }, `Ballottaggio con ${g.ballottaggio.con.map(c => `${c.nome} ${c.perc}%`).join(", ")}`));
  if (g.stato === "panchina") out.push(el("span", { class: "chip info" }, "Parte dalla panchina"));
  return out;
}

function renderPicker() {
  $("teams").replaceChildren(...SQUADRE.map(s => el("button", { type: "button", class: "team-btn", onclick: () => scegli(s.id) },
    el("span", { class: "team-name" }, s.nome), el("span", { class: "small" }, `${s.rosa.length} giocatori`))));
}

function renderCampo(righe) {
  const [d, c, a] = modulo.split("-").map(Number);
  const quanti = { P: 1, D: d, C: c, A: a };
  const scelti = new Set();
  $("modules").replaceChildren(...MODULI.map(m => el("button", { type: "button", "aria-pressed": String(m === modulo),
    onclick: () => { modulo = m; store.set("modulo", m); render(); } }, m)));
  $("field").replaceChildren(...["A", "C", "D", "P"].map(r => {
    const lista = righe.filter(x => x.g && x.g.ruolo === r).sort(perOrdine);
    const slots = [];
    for (let k = 0; k < quanti[r]; k++) {
      const x = lista[k];
      if (!x) { slots.push(el("div", { class: "slot empty" }, `Manca un ${ROLE_ONE[r]}`)); continue; }
      scelti.add(x.i);
      const g = x.g, pc = effPerc(g);
      const grave = g.avvisi.find(a => a.tipo === "Squalificato" || a.tipo === "Infortunato");
      slots.push(el("div", { class: "slot" },
        el("div", { class: "nm" }, el("span", { class: "role " + r }, r), el("span", {}, g.nome)),
        el("div", { class: "vs", title: `${g.squadra} contro ${g.avversario}` }, `${g.casa ? "vs" : "@"} ${g.avversario} · ${quando(partitaDi(g))}`),
        el("div", { class: "pc", style: `color:${pc >= 75 ? "var(--on-pitch)" : pc >= 50 ? "var(--on-pitch-warn)" : "var(--on-pitch-bad)"}` }, `${pc}%`),
        grave ? el("div", { class: "flag" }, grave.tipo) : null));
    }
    return el("div", { class: "line" }, slots);
  }));
  const panchina = righe.filter(x => x.g && !scelti.has(x.i))
    .sort((x, y) => ROLES.indexOf(x.g.ruolo) - ROLES.indexOf(y.g.ruolo) || perOrdine(x, y));
  $("bench").replaceChildren(...(panchina.length ? panchina.map(x => el("li", {},
    el("span", { class: "role " + (x.g.ruolo || "X") }, x.g.ruolo || "?"), `${x.g.nome} ${effPerc(x.g)}%`))
    : [el("li", {}, "Nessuno in panchina")]));
}

function renderTabella(righe) {
  const out = [];
  for (const r of [...ROLES, "X"]) {
    const lista = righe.filter(x => ((x.g && x.g.ruolo) || x.voce.ruolo || "X") === r).sort(perOrdine);
    if (!lista.length) continue;
    out.push(el("tr", { class: "group" }, el("td", { colspan: "5" }, `${ROLE_NAME[r]} · ${lista.length}`)));
    for (const { voce, g } of lista) {
      if (!g) {
        out.push(el("tr", {},
          el("td", {}, el("div", { class: "who" }, el("span", { class: "role " + (voce.ruolo || "X") }, voce.ruolo || "?"), voce.nome)),
          el("td", { colspan: "4", class: "missing" }, "Non compare nelle probabili di questa giornata (non convocabile, oppure la sua squadra non è nella lista Euroleghe).")));
        continue;
      }
      const p = partitaDi(g), info = DATI.squadre[g.squadra] || {}, pc = effPerc(g);
      out.push(el("tr", {},
        el("td", {}, el("div", { class: "who" }, el("span", { class: "role " + (g.ruolo || "X") }, g.ruolo || "?"), g.nome)),
        el("td", {}, el("div", {}, g.squadra), el("div", { class: "small" }, info.campionato || "")),
        el("td", {}, el("div", {}, `${g.casa ? "in casa contro" : "in trasferta a"} `, el("b", {}, g.avversario)),
          el("div", { class: "small" }, `${quando(p)}${p.giornata ? " · giornata " + p.giornata : ""}`)),
        el("td", {}, el("div", { class: "bar" }, el("b", { style: `color:${colore(pc)}` }, `${pc}%`), el("i", { style: `--v:${pc}%;--c:${colore(pc)}` }))),
        el("td", {}, el("div", { class: "notes" }, avvisiChips(g)),
          ...g.avvisi.filter(a => a.nota).map(a => el("div", { class: "small" }, `${a.tipo}: ${a.nota}`)),
          info.commento ? el("details", {}, el("summary", {}, `Le ultime su ${g.squadra}`), el("p", {}, info.commento)) : null)));
    }
  }
  $("rows").replaceChildren(...out);
}

function render() {
  const sq = squadraAttiva();
  $("teambar").hidden = !sq;
  $("picker").hidden = !!sq;
  $("pitch").hidden = $("rosaCard").hidden = !sq;
  if (!sq) { renderPicker(); return; }
  $("teamSelect").replaceChildren(...SQUADRE.map(s => el("option", { value: s.id }, s.nome)));
  $("teamSelect").value = sq.id;
  $("rosaTitle").textContent = `La rosa di ${sq.nome}`;
  const righe = righeRosa(sq);
  renderCampo(righe);
  renderTabella(righe);
}

function scegli(id) {
  attiva = id;
  store.set("squadraLega", id);
  render();
  window.scrollTo({ top: 0 });
}

$("teamSelect").addEventListener("change", e => scegli(e.target.value));

// ---------- Avvio ----------
function avvia([dati, lega]) {
  DATI = dati;
  SQUADRE = lega.squadre || [];
  for (const g of DATI.giocatori) {
    const k = norm(g.nome);
    if (!byName.has(k)) byName.set(k, []);
    byName.get(k).push(g);
  }
  const giornata = Object.values(DATI.partite).map(p => p.giornata).find(Boolean);
  $("sub").textContent = `${giornata ? "Giornata " + giornata + " · " : ""}probabili aggiornate il ${DATI.scaricato}`;
  $("foot").replaceChildren(
    "Squadre, avversari e percentuali di titolarità vengono dalle ",
    el("a", { href: DATI.fonte, target: "_blank", rel: "noopener" }, "probabili formazioni Euroleghe di Fantacalcio.it"),
    ", aggiornate ogni giorno alle 9 e alle 17. Infortunati e squalificati contano 0% nella formazione consigliata.");
  $("loading").hidden = true;
  render();
}

Promise.all([
  fetch("dati.json", { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
  fetch("squadre.json", { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
]).then(avvia).catch(() => {
  $("loading").textContent = "Non riesco a caricare i dati. Ricarica la pagina tra poco.";
  $("sub").textContent = "Dati non disponibili";
});
</script>
</body>
</html>
